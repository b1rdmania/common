# Copy to fly.toml, set `app`, then see docs/self-hosting.md.
app = "your-app-name"
primary_region = "lhr"

[build]

[env]
  TRUST_PROXY = "true"

[[mounts]]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
